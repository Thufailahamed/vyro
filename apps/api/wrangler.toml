name = "vyro-api"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Single origin: this Worker serves the built SPA (apps/web/dist) and the /api/* routes.
# run_worker_first keeps API traffic away from the asset layer so /api/* never falls
# through to the SPA index.html.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "vyro"
database_id = "41f2e2e3-29b0-4b20-8e36-92314adcf914"
migrations_dir = "../../packages/db/migrations"


[[r2_buckets]]
binding = "PRODUCTS"
bucket_name = "vyro-products"

[[r2_buckets]]
binding = "INVOICES"
bucket_name = "vyro-invoices"

[[r2_buckets]]
binding = "CROSS_BORDER_DOCS"
bucket_name = "vyro-cross-border-docs"

[[kv_namespaces]]
binding = "CACHE"
id = "5a6075baf1834db294abf12405ced2b8"

[[kv_namespaces]]
binding = "CROSS_BORDER_KV"
id = "local-cross-border-kv"

[[kv_namespaces]]
binding = "ALERTS_KV"
id = "local-alerts-kv"


[[queues.producers]]
binding = "AUDIT_QUEUE"
queue = "audit"

[[queues.producers]]
binding = "NOTIFICATIONS_QUEUE"
queue = "notifications"

[[queues.producers]]
binding = "INVOICES_QUEUE"
queue = "invoices"

[[queues.consumers]]
queue = "audit"
max_batch_size = 25
max_batch_timeout = 5

[[queues.consumers]]
queue = "notifications"
max_batch_size = 25
max_batch_timeout = 5

[[queues.consumers]]
queue = "invoices"
max_batch_size = 10
max_batch_timeout = 30

[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "vyro_metrics"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "local"
WEB_ORIGIN = "http://localhost:5173"
ADMIN_ORIGIN = "http://localhost:5174"
VYRO_AI_ENABLED = "true"
VYRO_AI_CLASSIFY_MODEL = "@cf/zai-org/glm-5.3-flash"
VYRO_AI_NARRATE_MODEL = "@cf/zai-org/glm-5.3-flash"
VYRO_AI_DAILY_TOKEN_CAP = "200000"
STATUS_PAGE_ORIGIN = "http://localhost:5173"
OPS_EMAIL = "ops@example.test"
UPTIMEROBOT_WEBHOOK_SECRET = "dev-uptime-secret"
# BETTER_AUTH_SECRET is intentionally NOT set in `[vars]` — set it as a local
# secret so it never accidentally ships to production:
#   npx wrangler secret put BETTER_AUTH_SECRET --config apps/api/wrangler.toml
# In CI/dev environments where the secret is unavailable, the auth package
# falls back to a dev-only marker so the app still boots.
BETTER_AUTH_URL = "https://vyro-api.thufailahamed627.workers.dev"

[triggers]
# Audit retention + daily housekeeping, webhook retry (every 15m),
# session cleanup (hourly), audit export runner (4am),
# observability sweep every 5 minutes, trust-signal rebuild (:13 hourly),
# FX + weekly sanctions refresh (2am), weekly supplier payout batch (Thu 21:30 UTC).
crons = ["0 3 * * *", "*/15 * * * *", "0 * * * *", "13 * * * *", "0 2 * * *", "0 4 * * *", "0 5 * * *", "17 7 * * *", "*/5 * * * *", "30 1 * * *", "30 21 * * 4"]

[env.production]
name = "vyro-api"

[env.production.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "vyro"
database_id = "41f2e2e3-29b0-4b20-8e36-92314adcf914"

[[env.production.r2_buckets]]
binding = "PRODUCTS"
bucket_name = "vyro-products"

[[env.production.r2_buckets]]
binding = "INVOICES"
bucket_name = "vyro-invoices"

[[env.production.r2_buckets]]
binding = "CROSS_BORDER_DOCS"
bucket_name = "vyro-cross-border-docs"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "5a6075baf1834db294abf12405ced2b8"

[[env.production.kv_namespaces]]
binding = "ALERTS_KV"
id = "16cb41bd35a34517a8403af93db17d05"

[[env.production.kv_namespaces]]
binding = "CROSS_BORDER_KV"
id = "2870af28aa6746a293ba068236f40129"

[[env.production.queues.producers]]
binding = "AUDIT_QUEUE"
queue = "audit"

[[env.production.queues.producers]]
binding = "NOTIFICATIONS_QUEUE"
queue = "notifications"

[[env.production.queues.producers]]
binding = "INVOICES_QUEUE"
queue = "invoices"

[[env.production.queues.consumers]]
queue = "audit"
max_batch_size = 25
max_batch_timeout = 5

[[env.production.queues.consumers]]
queue = "notifications"
max_batch_size = 25
max_batch_timeout = 5

[[env.production.queues.consumers]]
queue = "invoices"
max_batch_size = 10
max_batch_timeout = 30

[[env.production.analytics_engine_datasets]]
binding = "METRICS"
dataset = "vyro_metrics"

[env.production.ai]
binding = "AI"

[env.production.vars]
ENVIRONMENT = "production"
# Single origin: SPA and API are served by this Worker, so both origins are its own URL.
# Change all three if you attach a custom domain.
WEB_ORIGIN = "https://vyro-api.thufailahamed627.workers.dev"
ADMIN_ORIGIN = "https://vyro-api.thufailahamed627.workers.dev"
BETTER_AUTH_URL = "https://vyro-api.thufailahamed627.workers.dev"
QUEUE_EVENTS_RETENTION_DAYS = "7"
CROSS_BORDER_ENABLED = "true"
VYRO_AI_ENABLED = "true"
VYRO_AI_CLASSIFY_MODEL = "@cf/zai-org/glm-5.3-flash"
VYRO_AI_NARRATE_MODEL = "@cf/zai-org/glm-5.3-flash"
VYRO_AI_DAILY_TOKEN_CAP = "200000"
STATUS_PAGE_ORIGIN = "https://status.vyro.lk"
OPS_EMAIL = "ops@vyro.lk"
# Cross-border wire beneficiary details. Set as secrets in production so they
# never leak via wrangler.toml:
#   npx wrangler secret put VYRO_BANK_BENEFICIARY_NAME  --env production --config apps/api/wrangler.toml
#   npx wrangler secret put VYRO_BANK_BENEFICIARY_ADDRESS --env production --config apps/api/wrangler.toml
#   npx wrangler secret put VYRO_BANK_NAME               --env production --config apps/api/wrangler.toml
#   npx wrangler secret put VYRO_BANK_ADDRESS            --env production --config apps/api/wrangler.toml
#   npx wrangler secret put VYRO_BANK_ACCOUNT_NUMBER     --env production --config apps/api/wrangler.toml
#   npx wrangler secret put VYRO_BANK_SWIFT_BIC          --env production --config apps/api/wrangler.toml
#   npx wrangler secret put VYRO_BANK_IBAN               --env production --config apps/api/wrangler.toml
#   npx wrangler secret put VYRO_BANK_INTERMEDIARY_NAME  --env production --config apps/api/wrangler.toml
#   npx wrangler secret put VYRO_BANK_INTERMEDIARY_SWIFT --env production --config apps/api/wrangler.toml
#   npx wrangler secret put VYRO_BANK_REFERENCE_PREFIX   --env production --config apps/api/wrangler.toml
# BETTER_AUTH_SECRET is NOT set here on purpose — set it as a secret:
#   npx wrangler secret put BETTER_AUTH_SECRET --env production --config apps/api/wrangler.toml

[env.production.triggers]
crons = ["0 3 * * *", "*/15 * * * *", "0 * * * *", "13 * * * *", "0 2 * * *", "0 4 * * *", "0 5 * * *", "17 7 * * *", "*/5 * * * *", "30 1 * * *", "30 21 * * 4"]
