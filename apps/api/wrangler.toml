name = "vyro-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"

[[d1_databases]]
binding = "DB"
database_name = "vyro"
database_id = "local-vyro"

[[r2_buckets]]
binding = "PRODUCTS"
bucket_name = "vyro-products"

[[kv_namespaces]]
binding = "CACHE"
id = "local-cache"

[[queues.producers]]
binding = "AUDIT_QUEUE"
queue = "audit"

[[queues.producers]]
binding = "NOTIFICATIONS_QUEUE"
queue = "notifications"

[vars]
ENVIRONMENT = "local"
WEB_ORIGIN = "http://localhost:5173"
ADMIN_ORIGIN = "http://localhost:5174"
